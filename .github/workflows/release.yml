name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
      required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Package
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # v1.2.3-rc.1 -> 1.2.3: the bundle version must be numeric, the full tag stays on the release
          VERSION="${TAG#v}"
          make package VERSION="${VERSION%%[-+]*}" BUILD="${{ github.run_number }}"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/*.zip --clobber
